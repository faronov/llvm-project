name: Release MCS-51 LLVM toolchain

# Builds Clang, LLD and the LLVM binutils for MCS-51 / CC2530 from one exact
# source commit on five hosts and publishes them as a prerelease tagged at
# that commit. Firmware CI downloads these archives instead of building LLVM.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA of the MCS-51 LLVM source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcs51-llvm-release-${{ inputs.ref }}
  cancel-in-progress: false

env:
  LLVM_TOOLCHAIN_TOOLS: llc;llvm-ar;llvm-mc;llvm-nm;llvm-objcopy;llvm-objdump;llvm-ranlib;llvm-readobj;llvm-size;llvm-strip
  # Only these are built and installed; a plain "install" also ships clang-repl,
  # libclang, libLTO and the other clang tools (1.3 GB instead of ~0.3 GB).
  LLVM_DISTRIBUTION_COMPONENTS: clang;clang-resource-headers;lld;llc;llvm-ar;llvm-mc;llvm-nm;llvm-objcopy;llvm-objdump;llvm-ranlib;llvm-readobj;llvm-size;llvm-strip
  MCS51_LIT_TESTS: >-
    llvm/test/CodeGen/8051
    llvm/test/MC/MCS51
    lld/test/ELF/mcs51-relocations.s
    lld/test/ELF/mcs51-data-pointer-reloc.s
    lld/test/ELF/mcs51-11-bit-branch.s
    lld/test/ELF/mcs51-auto-bank.s
    lld/test/ELF/mcs51-auto-bank-fill.s

jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.id.outputs.sha }}
      version: ${{ steps.id.outputs.version }}
      tag: ${{ steps.id.outputs.tag }}
    steps:
      - name: Validate the commit SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full lowercase commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          sparse-checkout: cmake/Modules
          persist-credentials: false

      - name: Version and tag
        id: id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test "$SHA" = "${{ inputs.ref }}"
          VERSION="$(sed -nE 's/.*set\(LLVM_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\).*/\2/p' \
            cmake/Modules/LLVMVersion.cmake | paste -sd.)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="mcs51-llvm-${VERSION}-${SHA:0:12}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi
          { echo "sha=$SHA"; echo "version=$VERSION"; echo "tag=$TAG"; } | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.host }}
    needs: source
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: linux-amd64, runs_on: ubuntu-24.04, is_windows: false}
          - {host: linux-arm64, runs_on: ubuntu-24.04-arm, is_windows: false}
          - {host: macos-amd64, runs_on: macos-15-intel, is_windows: false}
          - {host: macos-arm64, runs_on: macos-26, is_windows: false}
          - {host: windows-amd64, runs_on: windows-2025, is_windows: true}
    env:
      NAME: ${{ needs.source.outputs.tag }}-${{ matrix.host }}
      # Keep the macOS binaries runnable on hosts older than the runner image.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SHA: ${{ needs.source.outputs.sha }}
      CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=Release
        -DLLVM_ENABLE_ASSERTIONS=ON
        -DLLVM_ENABLE_PROJECTS=clang;lld
        -DLLVM_TARGETS_TO_BUILD=MCS51
        -DLLVM_DEFAULT_TARGET_TRIPLE=mcs51
        -DLLVM_ENABLE_ZSTD=OFF
        -DLLVM_ENABLE_ZLIB=OFF
        -DLLVM_ENABLE_LIBXML2=OFF
        -DLLVM_ENABLE_LIBEDIT=OFF
        -DLLVM_ENABLE_TERMINFO=OFF
        -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON
        -DLLVM_INCLUDE_TESTS=ON
        -DLLVM_BUILD_TESTS=OFF
        -DCLANG_INCLUDE_TESTS=OFF
        -DLLVM_INCLUDE_BENCHMARKS=OFF
        -DLLVM_INCLUDE_EXAMPLES=OFF
        -DLLVM_BUILD_DOCS=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enable MSVC environment
        if: matrix.is_windows
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ninja-build cmake python3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Configure, build and install (Unix)
        if: ${{ !matrix.is_windows }}
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/install/$NAME"
          # shellcheck disable=SC2086
          cmake -S llvm -B build -G Ninja $CMAKE_FLAGS \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DLLVM_TOOLCHAIN_TOOLS="$LLVM_TOOLCHAIN_TOOLS" \
            -DLLVM_DISTRIBUTION_COMPONENTS="$LLVM_DISTRIBUTION_COMPONENTS"
          cmake --build build --target install-distribution
          # mcs51-runtime is not part of "all" and has no install-* target.
          cmake --build build --target mcs51-runtime llvm-config FileCheck not count split-file
          cmake --install build --component MCS51Runtime
          install -m 755 build/bin/llvm-config build/bin/FileCheck "$PREFIX/bin/"

      - name: Configure, build and install (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "install/$env:NAME"
          $flags = $env:CMAKE_FLAGS -split '\s+' | Where-Object { $_ }
          cmake -S llvm -B build -G Ninja @flags "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" `
            "-DCMAKE_INSTALL_PREFIX=$prefix" "-DLLVM_TOOLCHAIN_TOOLS=$env:LLVM_TOOLCHAIN_TOOLS" `
            "-DLLVM_DISTRIBUTION_COMPONENTS=$env:LLVM_DISTRIBUTION_COMPONENTS"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target install-distribution
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target mcs51-runtime llvm-config FileCheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --component MCS51Runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -Force build/bin/llvm-config.exe, build/bin/FileCheck.exe (Join-Path $prefix "bin")

      - name: MCS-51 lit tests
        if: ${{ !matrix.is_windows }}
        run: |
          # shellcheck disable=SC2086
          build/bin/llvm-lit -q $MCS51_LIT_TESTS

      - name: Strip, provenance and smoke test
        shell: bash
        env:
          RUNNER_IMAGE: ${{ matrix.runs_on }}
          VERSION: ${{ needs.source.outputs.version }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          PREFIX="install/$NAME"
          EXE=""; PY=python3
          if [ "$RUNNER_OS" = Windows ]; then EXE=.exe; PY=python; fi
          rm -rf "$PREFIX/share/man" "$PREFIX/share/doc"
          find "$PREFIX/bin" -type f \( -name '*.exe' -o -perm -111 \) -print0 |
            while IFS= read -r -d '' f; do "$PREFIX/bin/llvm-strip$EXE" "$f" 2>/dev/null || true; done
          for t in clang llc ld.lld llvm-ar llvm-mc llvm-objdump llvm-objcopy llvm-readobj llvm-config; do
            test -f "$PREFIX/bin/$t$EXE"
          done
          RES="$PREFIX/lib/clang/${VERSION%%.*}/mcs51"
          for f in mcs51-runtime.o libmcs51builtins.a cc2530_startup.o cc2530.ld; do test -f "$RES/$f"; done
          "$PY" - "$PREFIX/mcs51-toolchain.json" <<PY
          import json, os, sys
          json.dump({
              "name": "$NAME", "tag": "$TAG", "version": "$VERSION", "host": "${{ matrix.host }}",
              "source": {"repository": "$GITHUB_REPOSITORY", "commit": "$SHA"},
              "workflow_run": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
              "runner_image": "$RUNNER_IMAGE", "runner_image_version": os.environ.get("ImageVersion"),
              "assertions": True, "cmake_flags": os.environ["CMAKE_FLAGS"].split(),
          }, open(sys.argv[1], "w"), indent=2)
          PY
          cat "$PREFIX/mcs51-toolchain.json"
          # Compile and link CC2530 firmware with the installed toolchain only: the
          # driver takes the runtime, startup and linker script from the resource dir.
          mkdir -p smoke
          printf '%s\n' 'volatile unsigned char sink; unsigned long counter;' \
            'void __attribute__((interrupt(0))) isr(void) { counter += 3; }' \
            'int main(void) { unsigned short i; for (i = 0; i < 100; i++) counter = counter * 5 + i;' \
            '  sink = (unsigned char)(counter >> 8); for (;;) {} }' > smoke/main.c
          "$PREFIX/bin/clang$EXE" --version
          "$PREFIX/bin/clang$EXE" -target mcs51 -mcpu=cc2530 -Oz smoke/main.c -o smoke/firmware.elf
          "$PREFIX/bin/llvm-objcopy$EXE" --output-target=ihex smoke/firmware.elf smoke/firmware.hex
          "$PREFIX/bin/llvm-readobj$EXE" --file-headers smoke/firmware.elf | grep -Eq 'Machine:.*(8051|MCS51)'
          test -s smoke/firmware.hex

      - name: Archive (Unix)
        if: ${{ !matrix.is_windows }}
        run: tar -C install -czf "$NAME.tar.gz" "$NAME"

      - name: Archive (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: Compress-Archive -Path "install/$env:NAME" -DestinationPath "$env:NAME.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish prerelease
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.source.outputs.tag }}-*
          path: dist
          merge-multiple: true

      - name: Create the release at the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.source.outputs.sha }}
          TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          test "$(ls | wc -l)" -eq 5
          sha256sum -- * > SHA256SUMS
          cat > ../notes.md <<EOF
          MCS-51 / CC2530 LLVM ${VERSION} toolchain built from \`${SHA}\`
          (Release, assertions enabled) by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Each archive holds one directory with \`bin/\` (clang, ld.lld, llc, llvm-mc,
          llvm-objcopy, llvm-objdump, llvm-ar, ...), the MCS-51 runtime, CC2530 startup
          object and linker script in \`lib/clang/${VERSION%%.*}/mcs51/\`, and
          \`mcs51-toolchain.json\` with the source commit and build flags.
          Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`.

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "MCS-51 LLVM ${VERSION} (${SHA:0:12})" --notes-file ../notes.md -- *
